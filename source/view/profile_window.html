<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodWriter</title>
</head>
<body>
    <div id="background"></div>
    <div id="menubar">
        <div id="title">
            <h1>My Writer Archive</h1>
        </div>
        <p id="my_stars">★</p>
        <div id="stars_show">0</div>
        <p id="my_credits">cr</p>
        <div id="credits_show">0</div>
        <button id="enter_account">
            <div id="enter_account_content">
                Login/Sing in
            </div>
        </button>
        <button id="menu_button">
            <p id="menu_button_content">Menu ☰</p>
        </button>
    </div>
    <div id="divisor"></div>
    <div id="content">
        <div id="profile_image_div">
            <img src="../../assets/original_images/nan_user.png" alt="profile image" id="profile_image">
        </div>
        <div id="user_name">
            <p>User name</p>
        </div>
    </div>
    <link rel="stylesheet" href="source/style/account/style_window_login.css">
    <link rel="stylesheet" href="source/style/account/style_menubar.css">
    <link rel="stylesheet" href="source/style/account/style_content.css">
    <script src="source/controller/profile_window_controller.js"></script>
</body>
</html>
